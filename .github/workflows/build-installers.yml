name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - feature/0.39-reliability
    paths:
      - "app.py"
      - "chess_camera.py"
      - "runtime_app_patch.py"
      - "runtime_paths.py"
      - "requirements.txt"
      - "version.py"
      - "books/**"
      - "packaging/**"
      - "build_windows_exe.bat"
      - ".github/workflows/build-installers.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app.py"
      - "chess_camera.py"
      - "runtime_app_patch.py"
      - "runtime_paths.py"
      - "requirements.txt"
      - "version.py"
      - "books/**"
      - "packaging/**"
      - "build_windows_exe.bat"
      - ".github/workflows/build-installers.yml"

permissions:
  contents: read

jobs:
  windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build portable EXE package
        shell: cmd
        run: build_windows_exe.bat
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: ChessCamera-Windows-x64
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30

  debian-package:
    name: Debian package
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Debian build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev python3-venv libgl1 libglib2.0-0 libx11-6 libxcb1
      - name: Build DEB package
        env:
          PYTHON_BIN: python
        run: bash packaging/build_deb.sh
      - name: Inspect DEB metadata
        run: dpkg-deb --info release/*.deb
      - name: Upload Debian package
        uses: actions/upload-artifact@v4
        with:
          name: ChessCamera-Debian-amd64
          path: release/*.deb
          if-no-files-found: error
          retention-days: 30

  macos-app:
    name: macOS app and DMG
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build ChessCamera.app and DMG
        env:
          PYTHON_BIN: python
        run: bash packaging/build_macos.sh
      - name: Verify app bundle
        run: |
          test -d dist/ChessCamera.app
          test -f dist/ChessCamera.app/Contents/Info.plist
          plutil -p dist/ChessCamera.app/Contents/Info.plist | grep NSCameraUsageDescription
      - name: Upload macOS packages
        uses: actions/upload-artifact@v4
        with:
          name: ChessCamera-macOS
          path: |
            release/*.dmg
            release/*-app.zip
          if-no-files-found: error
          retention-days: 30
